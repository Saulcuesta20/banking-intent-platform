version: 2.0.0
description: Declarative asset extraction contract for corpus ingestion.

ontology_layers:
  description: >
    Enterprise structure taxonomy used by the LLM to classify every entity.
    Applies during Fase 0 (semantic-space analysis) and throughout extraction without
    extra questions. Layers map to true business sub-types.
  layers:
    party:
      description: "Personas/contrapartes (cliente, prospecto, proveedor, regulador, partner)"
      examples: ["Retail Customer", "Corporate Treasurer", "Marketplace Partner"]
    organization:
      description: "Divisiones, direcciones, departamentos, equipos"
      examples: ["Retail & Digital Banking Division", "Customer Experience Department"]
    capability:
      description: "Funciones o centros de competencia"
      examples: ["Operations Control Capability", "Technology Enablement"]
    portfolio:
      description: "Suites/bundles que agrupan ofertas"
      examples: ["Everyday Banking Suite", "Business Banking Starter Suite"]
    offering:
      description: "Producto o servicio comercializable"
      examples: ["SmartBalance Checking", "FlexPay Personal Loan", "ShieldGuard Insurance"]
    program:
      description: "Iniciativas o campañas coordinadas"
      examples: ["RapidRefi Program", "Sustainability Scoring Initiative"]
    channel:
      description: "Medios/plataformas de interacción"
      examples: ["Digital Onboarding Portal", "Branch Network", "Contact Center"]
    transaction:
      description: "Movimientos operativos o financieros"
      examples: ["FlexPay Disbursement", "International Transfer", "Insurance Enrollment"]
    agreement:
      description: "Contratos, políticas, términos, consentimientos"
      examples: ["Retail Banking Service Agreement", "ShieldGuard Protection Terms"]
    event:
      description: "Hitos, SLA, incidentes"
      examples: ["Debit Activation Event", "Onboarding SLA", "High-Value Transfer Hold"]
    metric:
      description: "Indicadores, KPIs, tasas, scores"
      examples: ["ShieldGuard Attachment Rate", "FlexPay Approval Rate"]
    workforce:
      description: "Personas/puestos específicos"
      examples: ["Customer Experience Specialist", "Operations Control Analyst"]
    workforce_role:
      description: "Roles/perfiles que describen responsabilidades"
      examples: ["Onboarding Advisor", "Fraud Investigator", "Portfolio Manager"]
    business_resource:
      description: "Recursos, plataformas, documentos, datasets"
      examples: ["OmniChannel Orchestrator", "Insight360 Analytics Platform", "Customer Experience Playbook"]
  entity_role_definitions:
    org_unit: "Unidad organizacional jerárquica"
    capability: "Función o competencia transversal"
    offering: "Producto/servicio ofrecido"
    workforce_member: "Persona que ejecuta tareas"
    workforce_role: "Rol o perfil asignado a workforce"
    asset: "Legacy role for business_resource while entity_role is migrated away"
    transaction: "Movimiento operativo/financiero"
    agreement: "Contrato o política que gobierna"
    metric: "Indicador o KPI"
    event: "Hito o estado temporal"
    party: "Cliente, prospecto, proveedor u otra contraparte"

output_contract:
  description: >
    LLM extraction returns JSON arrays keyed by asset type. The ingestion
    pipeline validates, normalizes, hydrates, relates, reviews, and versions
    those candidates before deployment.
  required_top_level_arrays:
    - user_tasks
    - flows
  optional_top_level_arrays:
    - domain
    - semantic_space
    - module
    - menu
    - form
    - form_version
    - asset_set
    - tool_registry
    - document
    - configuration
    - ruleset
    - concept
    - entity
    - business_rule
    - process
    - plan
    - qa
    - causality
  compatibility_notes:
    - "The legacy flow loader still consumes top-level user_tasks and flows."
    - "All asset types are governed by asset_contracts and follow one ingestion lifecycle."

type_definitions:
  user_action:
    description: User-facing action within a user_task.
    lifecycle_states: [not_started, on_user_enter, cancelled, completed]
    variants:
      front:
        description: UI or channel interaction.
        required_fields: [action_id, type, implementation_type]
        optional_fields: [label, triggers, description, lifecycle_state]
      back:
        description: Operation invocation from a task.
        required_fields: [action_id, type, implementation_type]
        optional_fields: [tool_id, tool_ids, label, description, lifecycle_state]
  tool:
    description: Tool or system operation.
    variants:
      frontend_tool:
        description: UI event or client-side action.
        required_fields: [tool_id, tool_type, operation, resource]
        optional_fields: [label, frontend_event, description]
      backend_tool:
        description: System/API/database/service operation.
        required_fields: [tool_id, tool_type, operation, resource]
        optional_fields: [description, backend_protocol, endpoint, requires_approval]
      llm_tool:
        description: LLM-backed decision or generation operation.
        required_fields: [tool_id, tool_type, operation]
        optional_fields: [description, llm_model, llm_provider, llm_operation]

asset_contracts:
  domain:
    description: Legacy launcher/configuration domain container used to group modules and navigation. Use semantic_space for ontology search context.
    extraction_array: domain
    required_fields: [domain_id, name, purpose]
    optional_fields: [description, order, icon, tags]
    payload_fields: [domain_id, name, purpose, description, order, icon, tags]
    composition:
      contains:
        modules:
          target_asset_type: module
          required: false
    relations:
      allowed: []
    runtime_semantics:
      executable: false
      route_kind: supporting_configuration
      used_for: launcher_navigation

  semantic_space:
    description: Ontology search context that groups entities, structural layers, and retrieval policy for Ask.
    extraction_array: semantic_space
    required_fields: [semantic_space_id, name]
    optional_fields: [route_hints, structural_layers, allowed_asset_types, retrieval_policy, entities, description]
    payload_fields: [semantic_space_id, name, route_hints, structural_layers, allowed_asset_types, retrieval_policy, entities, description]
    composition:
      contains:
        entities:
          target_asset_type: entity
          required: false
    relations:
      derived_relations:
        - type: contains_context
          source: semantic_space
          target: entity
          source_field: semantic_space_id
          target_field: entities
      allowed:
        - contains_context
        - routes_to_asset
        - governed_by_rule
    runtime_semantics:
      executable: false
      route_kind: supporting_knowledge
      used_for: [ask_routing, ontology_navigation, retrieval_scoping]

  module:
    description: Configurable launcher module contained by a domain.
    extraction_array: module
    required_fields: [module_id, domain_id, name, purpose]
    optional_fields: [description, order, icon, menus, tags]
    payload_fields: [module_id, domain_id, name, purpose, description, order, icon, menus, tags]
    composition:
      belongs_to:
        field: domain_id
        target_asset_type: domain
        target_field: domain_id
        required: true
      contains:
        menus:
          target_asset_type: menu
          required: false
        forms:
          target_asset_type: form
          required: false
    relations:
      derived_relations:
        - type: belongs_to_domain
          source: module
          target: domain
          source_field: module_id
          target_field: domain_id
      allowed:
        - belongs_to_domain
    runtime_semantics:
      executable: false
      route_kind: supporting_configuration
      used_for: [launcher_navigation, module_registry]

  menu:
    description: Launcher menu or submenu entry contained by a module.
    extraction_array: menu
    required_fields: [menu_id, module_id, label, path]
    optional_fields: [description, order, icon, parent_menu_id, children, target_asset_id]
    payload_fields: [menu_id, module_id, label, path, description, order, icon, parent_menu_id, children, target_asset_id]
    composition:
      belongs_to:
        field: module_id
        target_asset_type: module
        target_field: module_id
        required: true
      may_route_to:
        field: target_asset_id
        target_asset_type: asset
        required: false
    relations:
      derived_relations:
        - type: belongs_to_module
          source: menu
          target: module
          source_field: menu_id
          target_field: module_id
      allowed:
        - belongs_to_module
    runtime_semantics:
      executable: false
      route_kind: supporting_configuration
      used_for: launcher_navigation

  form:
    description: Renderer-neutral form definition contained by a module.
    extraction_array: form
    required_fields: [form_id, module_id, name, purpose]
    optional_fields: [description, fields, layout, validation, bindings, current_version]
    payload_fields: [form_id, module_id, name, purpose, description, fields, layout, validation, bindings, current_version]
    composition:
      belongs_to:
        field: module_id
        target_asset_type: module
        target_field: module_id
        required: true
      versions:
        target_asset_type: form_version
        required: false
    relations:
      derived_relations:
        - type: belongs_to_module
          source: form
          target: module
          source_field: form_id
          target_field: module_id
      allowed:
        - belongs_to_module
        - has_current_version
    runtime_semantics:
      executable: false
      route_kind: supporting_configuration
      used_for: dynamic_rendering

  form_version:
    description: Immutable version of a renderer-neutral form definition.
    extraction_array: form_version
    required_fields: [form_id, version, schema]
    optional_fields: [renderer, bindings, validation, migration_notes]
    payload_fields: [form_id, version, schema, renderer, bindings, validation, migration_notes]
    composition:
      version_of:
        field: form_id
        target_asset_type: form
        target_field: form_id
        required: true
    relations:
      derived_relations:
        - type: version_of
          source: form_version
          target: form
          source_field: form_id
          target_field: form_id
      allowed:
        - version_of
    runtime_semantics:
      executable: false
      route_kind: supporting_configuration
      immutable: true
      used_for: [dynamic_rendering, audit_history]

  asset_set:
    description: Versioned deployment container that groups assets for review, validation, deployment, and rollback.
    extraction_array: asset_set
    required_fields: [asset_set_id, version, primary_asset_type, members]
    optional_fields: [domain_id, module_id, status, description, owner, tags, metadata]
    payload_fields: [asset_set_id, version, primary_asset_type, members, domain_id, module_id, status, description, owner, tags, metadata]
    composition:
      contains:
        members:
          target_asset_type: asset
          required: true
          immutable_after_activation: true
    relations:
      derived_relations:
        - source: asset_set
          target: asset
          source_field: asset_set_id
          target_field: members
          type_by_target_asset_type:
            flow: groups_flow
            process: groups_process
            plan: groups_plan
            ruleset: groups_ruleset
            business_rule: groups_rule
            entity: groups_entity
            tool: groups_tool
            qa: groups_qa
            causality: groups_causality
            user_task: groups_user_task
      allowed:
        - groups_flow
        - groups_process
        - groups_plan
        - groups_ruleset
        - groups_rule
        - groups_entity
        - groups_tool
        - groups_qa
        - groups_causality
        - groups_user_task
    runtime_semantics:
      executable: false
      route_kind: supporting_knowledge
      deployment_boundary: true
      lifecycle: [draft, ready_for_review, in_review, validated, active]

  flow:
    description: User-facing use case selected by Ask and routed to process or plan execution options.
    extraction_array: flows
    required_fields: [flow_id, flow_name, purpose, business_event, explanation]
    optional_fields: [inputs, outputs]
    payload_fields: [flow_id, flow_name, purpose, business_event, user_task_refs, related_process_ids, inputs, outputs, explanation]
    composition:
      references:
        user_task_refs:
          target_asset_type: user_task
          target_field: user_task_id
          required: false
    relations:
      derived_relations:
        - type: decomposes_to_user_task
          source: flow
          target: user_task
          source_field: flow_id
          target_field: user_task_refs
      allowed:
        - implemented_by_process
        - governed_by_rule
        - decomposes_to_user_task
        - uses_concept
        - uses_entity
    runtime_semantics:
      executable: false
      selected_by: purpose
      triggered_by: business_event
      execution_target: process_or_plan

  user_task:
    description: Reusable human/business step that may appear in flows or process nodes.
    extraction_array: user_tasks
    required_fields: [user_task_id, task, type, name, description]
    optional_fields: [user_actions, tools]
    payload_fields: [user_task_id, task, type, name, description, user_actions, tools]
    composition:
      contains:
        user_actions:
          target_asset_type: user_action
          required: false
        tools:
          target_asset_type: tool
          required: false
    relations:
      derived_relations:
        - type: invokes_tool
          source: user_task
          target: tool
          source_field: user_task_id
          target_field: tools.tool_id
      allowed:
        - invokes_tool
        - used_by_flow
        - used_by_process
        - governed_by_rule
        - uses_concept
        - uses_entity
    runtime_semantics:
      executable: false
      may_bind_to_process_node_type: user_task
      wait_state_default: true

  tool:
    description: Registered frontend, backend, or LLM tool used by user tasks, plans, or processes.
    extraction_array: tool_registry
    required_fields: [tool_id, tool_type, operation]
    optional_fields: [resource, label, description, frontend_event, backend_protocol, endpoint, requires_approval]
    payload_fields: [tool_id, tool_type, operation, resource, label, description, frontend_event, backend_protocol, endpoint, requires_approval, user_tasks, flows]
    composition:
      variants_from: type_definitions.tool
    relations:
      allowed:
        - invoked_by_process
        - invoked_by_plan
        - invoked_by_user_task
        - provides_capability
        - requires_approval
        - governed_by_rule
    runtime_semantics:
      executable: true
      execution_target: orchestrator_node

  concept:
    description: Legacy compatibility alias for entity.
    extraction_array: entity
    required_fields: [name]
    optional_fields: [description, aliases, evidence, attributes, relations]
    payload_fields: [entity_id, name, aliases, attributes, relations, description, evidence]
    composition:
      alias_of:
        target_asset_type: entity
        required: false
    relations:
      allowed:
        - synonym_of
        - related_to
        - used_by_flow
        - used_by_process
        - explained_by_qa
    runtime_semantics:
      executable: false
      used_for: retrieval_expansion

  entity:
    description: Canonical business or technical entity/concept used for vocabulary, retrieval, and graph relationships.
    extraction_array: entity
    required_fields: [name]
    optional_fields: [description, aliases, evidence, attributes, relations, structural_layer, subtype, technical_type, business_layer, entity_role]
    payload_fields: [entity_id, name, aliases, attributes, relations, description, evidence, structural_layer, subtype, technical_type, business_layer, entity_role, cardinality, direction, semantic_space, sector]
    composition:
      contains:
        attributes:
          target_asset_type: data_attribute
          required: false
        relations:
          target_asset_type: asset_relation
          required: false
    relations:
      allowed:
        - has_synonym
        - synonym_of
        - related_to
        - classifies
        - contains_context
        - governed_by
        - affects
        - increases
        - decreases
        - represents
        - represented_by
        - materializes
        - materialized_in
        - used_by_flow
        - used_by_process
        - explained_by_qa
    runtime_semantics:
      executable: false
      used_for: retrieval_expansion

  business_rule:
    description: Constraint, eligibility condition, policy, or decision rule.
    extraction_array: business_rule
    required_fields: [name]
    optional_fields: [description, transaction_id, ruleset_name, rule_text, when, conditions, then, consequences, applies_to]
    payload_fields: [rule_id, rule_text, when, conditions, then, consequences, applies_to, transaction_id, ruleset_name]
    composition:
      when_then:
        when:
          description: Event or condition that triggers rule evaluation.
          required: false
        then:
          description: Consequence, validation result, decision, or action produced by the rule.
          required: false
    relations:
      allowed:
        - applies_to_flow
        - applies_to_process
        - applies_to_plan
        - depends_on_data_attribute
        - explains_concept
        - cited_by_qa
        - uses_entity
    runtime_semantics:
      executable: false
      evaluated_when: when
      constrains: [flow, process, plan]

  ruleset:
    description: Transaction-scoped group of business rules, validations, and related entities.
    extraction_array: ruleset
    required_fields: [name]
    optional_fields: [ruleset_id, transaction_id, rules, entities, description]
    payload_fields: [ruleset_id, transaction_id, rules, entities, description]
    composition:
      contains:
        rules:
          target_asset_type: business_rule
          required: false
    relations:
      allowed:
        - groups_rule
        - uses_entity
        - applies_to_flow
        - applies_to_process
        - applies_to_plan
    runtime_semantics:
      executable: false
      used_for: [grouped_rule_explanation, transaction_policy_bundle, validation_context]

  process:
    description: Canonical executable workflow with nodes, transitions, decisions, systems, rules, and exceptions.
    extraction_array: process
    required_fields: [name]
    optional_fields: [description, transaction_id, business_event, triggers, steps, execution_nodes, transitions, rules, tools]
    payload_fields: [process_id, process_name, business_event, triggers, execution_nodes, transitions, decisions, systems, exceptions, rules, tools]
    composition:
      triggered_by:
        field: business_event
        description: Business event that starts the process.
        required: false
      execution_nodes:
        allowed_node_types_from: config/model/node_types.yaml
        required: false
      transitions:
        source_field: from_node
        target_field: to_node
        condition_field: condition
        required: false
    relations:
      allowed:
        - implements_flow
        - realizes_plan
        - has_node
        - governed_by_rule
        - invokes_tool
        - requires_document
        - uses_concept
        - uses_entity
    runtime_semantics:
      executable: true
      execution_target: orchestrator.langgraph
      event_rule: "when business_event is received, start the process at a start node or first execution node"

  plan:
    description: Approved sequence of business steps and tool references used to compose or preview work.
    extraction_array: plan
    required_fields: [name]
    optional_fields: [description, objective, transaction_id, business_event, steps, tools, dependencies]
    payload_fields: [plan_id, objective, business_event, steps, tools, dependencies, execution_options]
    composition:
      triggered_by:
        field: business_event
        required: false
      steps:
        target_asset_type: user_task
        required: false
    relations:
      allowed:
        - decomposes_to_user_task
        - implemented_by_process
        - supports_flow
        - governed_by_rule
        - invokes_tool
        - uses_entity
    runtime_semantics:
      executable: false
      execution_target: flow_or_process

  qa:
    description: Grounded question and answer pair.
    extraction_array: qa
    required_fields: [question, answer]
    optional_fields: [purpose, transaction_id, citations]
    payload_fields: [question, answer, purpose, source, citations, transaction_id]
    relations:
      allowed:
        - references_rule
        - explains_concept
        - suggests_flow
        - cites_document
        - uses_entity
    runtime_semantics:
      executable: false
      route_kind: direct_answer

  document:
    description: Source artifact, policy, wiki page, manual, BPMN file, API spec, or corpus chunk.
    extraction_array: document
    required_fields: [path]
    optional_fields: [kind, title, source, text, description]
    payload_fields: [path, kind, sequence, title, source, text, description]
    composition:
      evidence_for:
        target_asset_type: asset
        required: false
    relations:
      allowed:
        - evidence_for_asset
        - cites_policy
        - describes_process
    runtime_semantics:
      executable: false
      used_for: [rag_context, source_citation, ingestion_evidence]

  configuration:
    description: Runtime and governance configuration for routing, retrieval, policies, thresholds, and source selection.
    extraction_array: configuration
    required_fields: [name]
    optional_fields: [configuration_id, description, settings, policy, applies_to]
    payload_fields: [configuration_id, name, description, settings, policy, applies_to]
    composition:
      configures:
        target_asset_type: asset
        required: false
    relations:
      allowed:
        - configures_route
        - configures_source
        - governs_asset_type
    runtime_semantics:
      executable: false
      used_for: [route_policy, source_selection, runtime_governance]

  causality:
    description: Governed cause/effect assertion linking conditions, rules, entities, plans, flows, and processes.
    extraction_array: causality
    required_fields: [statement]
    optional_fields: [transaction_id, relation_kind, cause_text, effect_text, evidence]
    payload_fields: [cause_text, effect_text, relation_kind, evidence, targets, transaction_id]
    composition:
      cause_effect:
        cause_field: cause_text
        effect_field: effect_text
        relation_field: relation_kind
    relations:
      allowed:
        - has_cause
        - has_effect
        - supported_by_rule
        - applies_to_process
        - applies_to_flow
        - affects_entity
    runtime_semantics:
      executable: false
      used_for: causal_explanation

rules:
  - "Return only valid JSON. Do not include markdown."
  - "Derive every asset name, purpose, field value, event, relation, and rule from the corpus."
  - "Do not copy placeholder values; no examples are provided intentionally."
  - "Use the asset type definitions to classify what you find in the corpus."
  - "A Flow is a complete end-to-end business process with multiple steps, roles, and automation."
  - "A UserTask is a single step within a flow."
  - "A Tool is a capability invoked by a user task."
  - "An Entity is a business or technical ontology element; concept is only a legacy alias for entity."
  - "A BusinessRule is conditional logic with conditions and consequences."
  - "A QA is a question-answer pair."
  - "A Causality is a cause-effect relationship."
  - "Container assets (domain, module, menu, form) describe platform structure; semantic_space describes ontology search context for Ask."
  - "Use purpose to describe why an asset exists and provide semantic text that helps Ask match user needs."
  - "Create user_tasks for business/user steps; reuse them across flows where possible."
  - "A flow references tasks through user_task_refs; the task definitions live in user_tasks."
  - "Model each user_task with user_actions and/or tools."
  - "A user_action.type is either front for UI/channel interaction or back for operation invocation."
  - "A back user_action can reference one or more tools through tool_id or tool_ids."
  - "User actions carry lifecycle_state to track not_started, on_user_enter, cancelled, or completed."
  - "Back actions reference backend or LLM tools through tool_id/tool_ids."
  - "Tool types are frontend_tool, backend_tool, or llm_tool."
  - "Model entities as separate entity assets, not as flow fields."
  - "For business_rule, prefer when/then plus conditions/consequences."
  - "For entity, include relations only when the corpus supports them."
  - "If images are provided, first read their visible text and diagrams, then use that information with text files."
  - "Do not manually add concept_aliases; aliases belong to governed entity aliases."
  - "Classify each entity into one structural_layer: party, organization, capability, portfolio, offering, program, channel, transaction, agreement, event, metric, workforce, workforce_role, business_resource."
  - "Set entity.structural_layer to that layer name (e.g., organization, offering, workforce, business_resource)."
  - "Use entity.subtype for the business/structural stereotype inside the layer (e.g., party/customer, organization/department, business_resource/table)."
  - "Use entity.technical_type only for the technical implementation form (e.g., table, api, dataset, service); it is not the same as subtype."
  - "For technical resources that represent business entities, use represents / represented_by. Treat materializes / materialized_in as legacy aliases only."
  - "Only include entity_role for legacy compatibility when the corpus explicitly uses role language; structural_layer is the primary field."
  - "Layers must stay generic. Do NOT invent new asset types; keep using entity + structural_layer."
  - "Examples: Customer Experience Department → organization/org_unit, FlexPay Personal Loan → offering/offering, ShieldGuard Attachment Rate → metric/metric, Customer Experience Specialist → workforce/workforce_member."
