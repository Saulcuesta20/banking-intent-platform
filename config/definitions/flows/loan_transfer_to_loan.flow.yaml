flow_id: loan.transfer_to_loan
flow_name: Transfer To Loan
version: 1.0.0
status: approved
domain: banking.loans
owner: Payments Operations
description: Executable flow definition for transferring funds to a loan.
related_flow_ids:
  - loan.transfer_to_loan
triggers:
  - quiero transferir dinero a mi prestamo
inputs:
  - source_account_id
  - loan_id
  - transfer_amount
outputs:
  - transfer_id
user_flow:
  - name: start
    type: start
    implementation: builtin.start
    description: Start transfer to loan.
  - name: capture_transfer_to_loan
    type: user_task
    implementation: task.capture_transfer_to_loan
    description: Capture the account, loan, and transfer amount.
    required_inputs:
      - source_account_id
      - loan_id
      - transfer_amount
    user_actions:
      - action: action.loan.open_transfer_form
        type: front
        implementation_type: show_form
        label: Open transfer to loan form
        description: Show the transfer-to-loan form.
      - action: tool.loan.transfer.apply
        type: back
        implementation_type: tool_call
        tool: tool.loan.transfer.apply
        description: Move funds from the source account to the loan.
  - name: end
    type: end
    implementation: builtin.end
    description: Finish transfer to loan.
