<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Prototipo B – React Flow</title>
    <style>
      :root {
        --ink: #10213d;
        --muted: #667892;
        --line: #d7dfeb;
        --panel: #ffffff;
        --canvas: #f4f7fb;
        --blue: #1463ff;
        --blueSoft: #eaf1ff;
        --purple: #6f3fd3;
        --teal: #18978f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--canvas);
        color: var(--ink);
      }
      .app {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 100vh;
      }
      .tabs {
        display: flex;
        gap: 12px;
      }
      .tab {
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }
      .tab.active {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }
      .workspace {
        flex: 1;
        display: grid;
        grid-template-columns: 0.55fr 0.45fr;
        gap: 16px;
        min-height: 0;
      }
      .panel {
        background: var(--panel);
        border-radius: 18px;
        border: 1px solid var(--line);
        padding: 20px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel h3 {
        margin: 0 0 12px;
      }
      .form-scroll {
        flex: 1;
        overflow: auto;
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 16px;
        background: #fff;
        color: var(--muted);
      }
      .rf-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .btn {
        border: none;
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
      }
      .btn.primary {
        background: var(--purple);
        color: #fff;
      }
      .btn.secondary {
        background: #fff;
        color: var(--purple);
        border: 1px solid var(--purple);
      }
      .reactflow {
        flex: 1;
        border-radius: 12px;
        background: linear-gradient(135deg, #fff, #fef8ff);
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .rf-node {
        position: absolute;
        padding: 12px 14px;
        border-radius: 14px;
        background: #fff;
        border: 2px solid;
        box-shadow: 0 6px 20px rgba(16, 33, 61, 0.15);
        min-width: 140px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
      }
      .rf-node small {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .rf-node.capability {
        border-color: var(--teal);
        top: 80px;
        left: 110px;
      }
      .rf-node.offering {
        border-color: var(--purple);
        top: 220px;
        left: 300px;
      }
      .rf-node.channel {
        border-color: var(--blue);
        top: 140px;
        left: 480px;
      }
      .rf-edge {
        position: absolute;
        height: 2px;
        background: var(--muted);
        transform-origin: top left;
      }
      .rf-edge::after {
        content: "enables";
        position: absolute;
        top: -14px;
        left: 50%;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--blueSoft);
        font-size: 11px;
        color: var(--blue);
        transform: translateX(-50%);
      }
      .side-panel {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 220px;
        background: #fff;
        border-radius: 16px;
        border: 1px solid var(--line);
        padding: 16px;
        box-shadow: 0 10px 24px rgba(16, 33, 61, 0.15);
      }
      .side-panel h4 {
        margin: 0 0 10px;
      }
      .side-panel label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .side-panel input,
      .side-panel select {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--line);
        margin-bottom: 10px;
      }
      @media (max-width: 1024px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="tabs">
        <div class="tab active">Structured Editor</div>
        <div class="tab">Raw Source</div>
        <div class="tab">Relations</div>
        <div class="tab">History</div>
      </div>
      <div style="color: var(--muted);">
        Business Model · business_model_kb · Fuente: ingest 20260616
      </div>
      <div class="workspace">
        <section class="panel">
          <h3>Formulario JSON</h3>
          <div class="form-scroll">
            <p>[Secciones de entidades, atributos, relaciones...]</p>
          </div>
        </section>
        <section class="panel">
          <div class="rf-toolbar">
            <button class="btn primary">+ Node</button>
            <button class="btn secondary">+ Edge</button>
            <button class="btn secondary">Filters</button>
            <button class="btn secondary">Auto layout</button>
            <button class="btn secondary">Fit view</button>
          </div>
          <div class="reactflow">
            <div class="rf-node capability">
              Onboarding Digital
              <small>Layer: Capability</small>
            </div>
            <div class="rf-node offering">
              Everyday Banking
              <small>Layer: Offering</small>
            </div>
            <div class="rf-node channel">
              App Móvil
              <small>Layer: Channel</small>
            </div>
            <div
              class="rf-edge"
              style="top: 140px; left: 210px; width: 200px; transform: rotate(15deg);"
            ></div>
            <div class="side-panel">
              <h4>Inspector</h4>
              <label>Nombre</label>
              <input value="Everyday Banking" />
              <label>Layer</label>
              <select>
                <option>Offering</option>
                <option>Capability</option>
                <option>Channel</option>
              </select>
              <label>Rol</label>
              <input value="Core" />
              <button class="btn primary" style="width: 100%;">Guardar</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
