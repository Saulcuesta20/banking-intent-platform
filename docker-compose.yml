services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-banking-intent-dev}"
    volumes:
      - neo4j-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["optional"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:16
    profiles: ["optional"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-banking_intent}"
      POSTGRES_USER: "${POSTGRES_USER:-banking_intent}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-banking-intent-dev}"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    profiles: ["optional"]
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USE_AI_PROVIDERS=${USE_AI_PROVIDERS:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - INTENT_LLM_MODEL=${INTENT_LLM_MODEL:-gpt-4o-mini}
      - QDRANT_HOST=${QDRANT_HOST:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-banking-intent-dev}
    volumes:
      - ./:/app:cached
    depends_on:
      - neo4j
    profiles: ["optional"]

volumes:
  neo4j-data:
  qdrant-data:
  postgres-data:
