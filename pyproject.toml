[project]
name = "banking-intent-platform"
version = "0.1.0"
description = "Enterprise Banking Intent Engine and Knowledge Graph Platform MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.24.0",
  "typer>=0.12.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.8.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "neo4j>=5.24.0",
  "llama-index>=0.11.0",
  "llama-index-graph-stores-neo4j>=0.1.0",
  "llama-index-llms-openai>=0.1.0",
  "llama-index-embeddings-openai>=0.1.0",
  "langgraph>=0.1.0",
  "langchain>=0.0.0",
  "qdrant-client>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
kb = "app.platform_cli:main"
ask = "app.cli.ask:main"
ingest = "app.cli.ingest:main"
launcher = "app.launcher_cli:main"
database = "app.database_cli:main"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "tools*"]
exclude = ["data*", "docs*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
