asset_id: form.loan-create-form
asset_type: form
name: Colocacion - Crear prestamo
version: v1
description: Versioned form definition for loan.
tags:
- lending
- loan
- form
- jsonforms
payload:
  formId: loan-create-form
  version: v1
  pageId: loan-create
  title: Colocacion - Crear prestamo
  submitTitle: Enviar a workflow
  fields:
  - id: customer_id
    label: Cliente
    type: text
    required: true
    placeholder: ID o nombre del cliente
  - id: amount
    label: Monto
    type: number
    required: true
    placeholder: '10000'
  - id: term
    label: Plazo
    type: text
    required: true
    placeholder: 12, 24, 36 o 48 meses
  - id: purpose
    label: Proposito
    type: textarea
    required: false
    placeholder: Describe el motivo del prestamo
  domain_id: lending
  module_id: loan
  renderer: react
  binding_status: phase_two
