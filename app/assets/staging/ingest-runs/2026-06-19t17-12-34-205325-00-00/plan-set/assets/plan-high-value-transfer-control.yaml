owner: planning_kb
description: 'Goal: decide whether a high value international transfer can be released.'
text: "Goal: decide whether a high value international transfer can be released.\n\
  \nSteps:\n1. Identify the customer and validate active relationship.\n2. Capture\
  \ transfer details and normalize amount, currency, beneficiary, and\n   destination\
  \ country.\n3. Screen the beneficiary through the compliance screening gateway.\n\
  4. Evaluate high value transfer controls and destination risk.\n5. Request purpose\
  \ document when the control requires evidence.\n6. Route to manager or compliance\
  \ review when policy gates are triggered.\n7. Notify customer and record decision\
  \ evidence.\n\nExpected tools: ui.customer.identify, customer.identity.validate,\n\
  ui.transfer.capture, transfer.create, api.sanctions.screen, risk.case.create,\n\
  ui.document.request, notification.send, approval.update."
