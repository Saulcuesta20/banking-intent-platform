text: "Glosario Extendido - Ahorros y Préstamos (Parte 3)\n\nReglas de tarifas y comisiones:\n\
  - Comisión por manejo de cuenta: aplicable mensualmente si el saldo promedio cae\
  \ bajo umbral.\n- Comisión por transferencia urgente: tarifa fija por transferencias\
  \ con prioridad.\n- Comisión por descubierto: porcentaje sobre el monto sobregirado.\n\
  \nProcesos de atención:\n1) Gestión de reclamos:\n   - Recepción del reclamo en\
  \ canales (phone, mail, sucursal).\n   - Revisión documental y conciliación de movimientos.\n\
  \   - Resolución y comunicación al cliente en 7 días hábiles.\n2) Reexpedición de\
  \ tarjeta:\n   - Verificar identidad.\n   - Bloquear tarjeta anterior.\n   - Emitir\
  \ y enviar nueva tarjeta.\n\nPolíticas de riesgo:\n- Clientes con score bajo requieren\
  \ co-deudor o colateral.\n- Límites de exposición por cliente por tipo de producto.\n\
  \nTareas operativas (ejemplos nombrables como tasks para seeds):\n- customer.lookup\n\
  - account.balance.check\n- transaction.list\n- loan.eligibility.calculate\n- loan.refinance.prepare\n\
  - human.approval"
