    label: Tasa asociada
    type: text
    required: false
    placeholder: TASA_CONSUMO_12M
  - id: enabled
    label: Estado
    type: text
    required: true
    placeholder: Activo/Inactivo
  domain_id: master-data
  module_id: product-service-config
  renderer: lowdefy
  binding_status: phase_two
