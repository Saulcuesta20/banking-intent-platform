lowdefy: 5.3.0

name: DevBank Dynamic Flow Runtime

plugins:
  - name: "@devbank/lowdefy-asset-editors"
    version: "file:../../../lowdefy-plugins/asset-editors"

connections:
  - id: launcher_api
    type: AxiosHttp
    properties:
      baseURL: http://127.0.0.1:8030

theme:
  antd:
    token:
      colorPrimary: "#1463ff"
      borderRadius: 8
      fontFamily: Inter, system-ui, sans-serif

pages:
  - id: asset-flow-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: flow
  - id: asset-process-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: process
  - id: asset-business-rule-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: business_rule
  - id: asset-ontology-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: ontology
  - id: asset-qa-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: qa
  - id: asset-entity-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: entity
  - id: asset-tool-api-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: tool_api
  - id: asset-form-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: form
  - id: asset-module-menu-editor
    type: Box
    blocks:
      - id: asset_editor_host
        type: AssetEditorHost
        properties:
          apiBaseUrl: http://127.0.0.1:8030
          environment: dev
          actor: saul
          editorType: module_menu
  - id: asset-document-config-editor
